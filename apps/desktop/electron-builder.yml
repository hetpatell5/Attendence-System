# Windows packaging configuration.
appId: com.attendance.desktop
productName: Attendance Management System
asar: true
directories:
  output: release
  buildResources: build
files:
  - package.json
  - dist/**/*
  - dist-electron/**/*
extraMetadata:
  main: dist-electron/main.js
# Bundle the shutdown-gate C# source so main.ts can compile it in the packaged app
extraResources:
  - from: electron/shutdown-blocker.cs
    to: shutdown-blocker.cs
win:
  target: nsis
  artifactName: "${productName}-Setup-${version}.${ext}"
  # icon: build/icon.ico
nsis:
  oneClick: false
  perMachine: true                  # installs to Program Files
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Attendance
  runAfterFinish: true

# Auto-update: publish to GitHub Releases on the hetpatell5/Attendence-System repo.
# electron-updater reads latest.yml from the release assets to check for updates.
# The repo is public, so no GH_TOKEN is needed for clients to CHECK for updates.
# A GH_TOKEN is needed only when you RUN `pnpm package` to PUBLISH the release.
publish:
  provider: github
  owner: hetpatell5
  repo: Attendence-System
  releaseType: release
